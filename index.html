<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Қазақстан Эко-Картасы</title>
  
  <!-- Leaflet CSS (Карта стилі) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2e7d32;
      color: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .controls {
      background: #f8f9fa;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    select {
      padding: 8px 16px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #2e7d32;
      outline: none;
      background-color: white;
      cursor: pointer;
      font-weight: bold;
      color: #2e7d32;
    }
    #map {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌱 Қазақстанның Жалпы Эко-Картасы</h1>
    <p>Облыс орталықтарындағы қайта өңдеу және вторсырье қабылдау пункттері</p>
  </header>

  <!-- Қазақстан өңірлерін таңдау менюі -->
  <div class="controls">
    <label for="citySelect"><b>Өңірді / Қаланы таңдаңыз: </b></label>
    <select id="citySelect" onchange="changeCity()">
      <option value="aktau">Манғыстау облысы (Ақтау)</option>
      <option value="astana">Астана қаласы</option>
      <option value="almaty">Алматы қаласы</option>
      <option value="shymkent">Шымкент қаласы</option>
      <option value="karaganda">Қарағанды облысы (Қарағанды)</option>
      <option value="aktobe">Ақтөбе облысы (Ақтөбе)</option>
      <option value="atyrau">Атырау облысы (Атырау)</option>
      <option value="oral">Батыс Қазақстан (Орал)</option>
      <option value="pavlodar">Павлодар облысы (Павлодар)</option>
      <option value="oskemen">Шығыс Қазақстан (Өскемен)</option>
      <option value="semey">Абай облысы (Семей)</option>
      <option value="taraz">Жамбыл облысы (Тараз)</option>
      <option value="kyzylorda">Қызылорда облысы (Қызылорда)</option>
      <option value="petropavl">Солтүстік Қазақстан (Петропавл)</option>
      <option value="kokshetau">Ақмола облысы (Көкшетау)</option>
      <option value="kostanay">Қостанай облысы (Қостанай)</option>
      <option value="turkistan">Түркістан облысы (Түркістан)</option>
      <option value="taldykorgan">Жетісу облысы (Талдықорған)</option>
    </select>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Қазақстанның барлық облыс орталықтарының координаталары
    const cities = {
      aktau: { coords: [43.6481, 51.1722], zoom: 12 },
      astana: { coords: [51.1693, 71.4491], zoom: 12 },
      almaty: { coords: [43.2389, 76.8897], zoom: 12 },
      shymkent: { coords: [42.3155, 69.5869], zoom: 12 },
      karaganda: { coords: [49.8019, 73.1021], zoom: 12 },
      aktobe: { coords: [50.2839, 57.1670], zoom: 12 },
      atyrau: { coords: [47.0945, 51.9238], zoom: 12 },
      oral: { coords: [51.2278, 51.3861], zoom: 12 },
      pavlodar: { coords: [52.2873, 76.9671], zoom: 12 },
      oskemen: { coords: [49.9529, 82.6102], zoom: 12 },
      semey: { coords: [50.4111, 80.2275], zoom: 12 },
      taraz: { coords: [42.9000, 71.3667], zoom: 12 },
      kyzylorda: { coords: [44.8488, 65.4999], zoom: 12 },
      petropavl: { coords: [54.8667, 69.1500], zoom: 12 },
      kokshetau: { coords: [53.2833, 69.3833], zoom: 12 },
      kostanay: { coords: [53.2144, 63.6246], zoom: 12 },
      turkistan: { coords: [43.2973, 68.2517], zoom: 12 },
      taldykorgan: { coords: [45.0156, 78.3764], zoom: 12 }
    };

    // 2. 2GIS мәліметтеріне сүйенген нақты эко-нүктелер базасы
    const ecoPoints = [
      // Ақтау
      { city: "aktau", title: "Eco Waste Aqtau (Вторсырье)", category: "Пластик, Макулатура, Картон", address: "25-ші шағынаудан, 20/2", coords: [43.6591, 51.1712] },
      { city: "aktau", title: "Eco Waste Aqtau (Бас пункт)", category: "Пластик, Қағаз, Пленка", address: "3Б шағынауданы, 39/3", coords: [43.6705, 51.1895] },
      
      // Астана
      { city: "astana", title: "LS Astana (Пункт сбора вторсырья)", category: "Пластик, Макулатура, Шыны", address: "Сарыарқа проспектісі, 31/1а", coords: [51.1685, 71.4120] },
      { city: "astana", title: "СКО-ВторРесурс", category: "Картон, ПЭТ Бөтелкелер", address: "Е-67 көшесі, 8", coords: [51.1200, 71.4100] },

      // Алматы
      { city: "almaty", title: "Алатауэковтор", category: "Пластик, Шыны, Алюминий банкілер", address: "Сабатаев көшесі, 18", coords: [43.3200, 76.9200] },
      { city: "almaty", title: "Ecosen / Алатауэковтор", category: "Макулатура, Электроника, Пластик", address: "Байзақов көшесі, 73/1", coords: [43.2510, 76.9150] },

      // Шымкент
      { city: "shymkent", title: "АСПИК (Прием вторичного сырья)", category: "Макулатура, Пластик", address: "Қойкелді батыр көшесі, 95/2", coords: [42.3120, 69.6010] },

      // Қарағанды
      { city: "karaganda", title: "EcoTeam (Сбор вторсырья)", category: "Пластик, Кағаз, Металл", address: "Складская көшесі, 5", coords: [49.8150, 73.0900] },
      { city: "karaganda", title: "Вторичное сырье", category: "Макулатура, ПЭТ", address: "Пригородная көшесі, 2", coords: [49.7900, 73.1100] },

      // Ақтөбе
      { city: "aktobe", title: "Ақтөбе Вторсырье", category: "Пластик, Макулатура", address: "Санкибай батыр даңғылы, 24", coords: [50.2900, 57.1500] },

      // Атырау
      { city: "atyrau", title: "Атырау Эко Эко-бокс", category: "Пластик, Батареялар", address: "Сәтпаев көшесі, 18", coords: [47.1000, 51.9100] },

      // Өскемен
      { city: "oskemen", title: "Шығыс Вторресурс", category: "Қағаз, Картон, Пластик", address: "Абай даңғылы, 102", coords: [49.9600, 82.6000] },

      // Павлодар
      { city: "pavlodar", title: "Павлодар Эко-Пункт", category: "Пластик, Макулатура", address: "Камзин көшесі, 67", coords: [52.2800, 76.9800] }
    ];

    // 3. Картаны бастапқыда Ақтау бойынша ашу
    const map = L.map('map').setView(cities.aktau.coords, cities.aktau.zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap қатысушылары'
    }).addTo(map);

    let currentMarkers = [];

    // 4. Маркерлерді картаға шығару функциясы
    function renderMarkers(selectedCity) {
      currentMarkers.forEach(marker => map.removeLayer(marker));
      currentMarkers = [];

      ecoPoints.filter(p => p.city === selectedCity).forEach(point => {
        const marker = L.marker(point.coords).addTo(map);
        marker.bindPopup(`
          <div style="font-size:14px;">
            <b style="color:#2e7d32;">${point.title}</b><br>
            <b>Қабылданады:</b> ${point.category}<br>
            <b>Мекенжайы:</b> ${point.address}
          </div>
        `);
        currentMarkers.push(marker);
      });
    }

    // 5. Қала таңдалғанда орындалатын функция
    function changeCity() {
      const selectedCity = document.getElementById('citySelect').value;
      const cityData = cities[selectedCity];
      
      if (cityData) {
        // Картаны жаңа өңірге әдемі анимациямен жылжыту
        map.flyTo(cityData.coords, cityData.zoom);
        renderMarkers(selectedCity);
      }
    }

    // Алғашқы ашылғанда Ақтау маркерлерін жүктеу
    renderMarkers('aktau');
  </script>
</body>
</html>
